[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-txt"
dynamic = ["version"]
description = "Convert PDF files (including Chinese/CJK documents) to plain text"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf[crypto]>=4.0"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
test = ["pytest", "reportlab"]

[project.scripts]
pdf-to-txt = "pdf_to_txt:main"

[tool.setuptools]
py-modules = ["pdf_to_txt"]

[tool.setuptools.dynamic]
version = { attr = "pdf_to_txt.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
